<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="云湃 AI 通用任务界面">
  <title>云湃 AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="user" class="user-mode" data-login-url="__RUOYI_LOGIN_URL__" data-logout-url="__RUOYI_LOGOUT_URL__" data-manage-url="__RUOYI_MANAGE_URL__">
  <a class="skip-link" href="#pageRoot">跳到任务区</a>
  <div class="user-shell">
    <header class="user-topbar">
      <a class="user-brand" href="./" aria-label="云湃 AI 首页"><span class="brand-mark">YP</span><span><b>云湃 AI</b><small>本地智能服务</small></span></a>
      <div class="user-topbar-side">
        <span id="userIdentity" class="user-identity"></span>
        <button id="userLogout" class="button small quiet" type="button" hidden>退出</button>
        <span id="runtimeBadge" class="runtime-badge"><i></i>正在连接</span>
      </div>
    </header>
    <main id="pageRoot" class="user-page" tabindex="-1" aria-live="polite"></main>
    <footer class="user-footer">
      <a id="developerEntry" class="developer-entry" href="developer" hidden>开发者控制台 ↗</a>
    </footer>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
  <script src="app.js" defer></script>
</body>
</html>
