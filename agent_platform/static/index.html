<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="云湃 AI 通用任务界面">
  <title>云湃 AI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-mode="user" class="user-mode">
  <a class="skip-link" href="#pageRoot">跳到任务区</a>
  <div class="user-shell">
    <header class="user-topbar">
      <a class="user-brand" href="/" aria-label="云湃 AI 首页"><span class="brand-mark">YP</span><span><b>云湃 AI</b><small>本地智能服务</small></span></a>
      <span id="runtimeBadge" class="runtime-badge"><i></i>正在连接</span>
    </header>
    <main id="pageRoot" class="user-page" tabindex="-1" aria-live="polite"></main>
    <footer class="user-footer">
      <button id="developerEntry" class="developer-entry" type="button" title="开发者入口" aria-label="开发者入口">&#128274;</button>
    </footer>
  </div>
  <dialog id="developerLogin" class="login-dialog" aria-labelledby="loginTitle">
    <form id="developerLoginForm" method="dialog">
      <header><div><span class="eyebrow">DEVELOPER</span><h2 id="loginTitle">进入开发者控制台</h2></div><button id="closeLogin" class="icon-button" type="button" aria-label="关闭">×</button></header>
      <div class="dialog-body">
        <label class="field" for="developerPassword"><span>开发者密码</span><input id="developerPassword" class="input" type="password" autocomplete="current-password" required maxlength="1024"></label>
        <p id="loginError" class="login-error" role="alert"></p>
      </div>
      <footer><button class="button quiet" id="cancelLogin" type="button">取消</button><button class="button primary" type="submit">登录</button></footer>
    </form>
  </dialog>
  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
  <script src="/app.js" defer></script>
</body>
</html>
