[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Local-first edge-cloud agent backend for RK3588-class terminals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "winotify>=1.1,<2; platform_system == 'Windows'",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
tts = [
  "numpy>=1.26,<3",
  "sherpa-onnx==1.13.4",
]
voice = [
  "faster-whisper>=1.2,<2",
  "numpy>=1.26,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "sounddevice>=0.5,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
]

[project.scripts]
agent-platform = "agent_platform.cli:main"
agent-rkllm-mock = "agent_platform.devtools.rkllm_mock_server:main"
agent-rkllm-local = "agent_platform.devtools.local_rkllm_agent:main"

[tool.setuptools.packages.find]
include = ["agent_platform*", "evaluation*"]

[tool.setuptools.package-data]
agent_platform = ["config/*.yaml", "static/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_platform"]
