# RUOYI-AUTH-GATEWAY-001 Phase 6：板端网关最终配置
# 安装位置：/etc/nginx/nginx.conf（install.sh 自动备份并覆盖）
# 公网唯一入口：443。家宽封 443 时改监听 8443 并在路由器映射，见《部署手册》第 6 节。

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log gateway;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 限流①：登录端点防爆破（只作用于 /prod-api/login）
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # 限流②：全站防御基线
    limit_req_zone $binary_remote_addr zone=gateway:10m rate=30r/s;

    # 明文 HTTP 不提供任何内容，只 301 到 HTTPS（计划第 3 节明文底线）
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        # 家宽封 443：把这一行改成  listen 8443 ssl default_server;
        # 随后访问 https://<公网IP>:8443，路由器映射公网端口到板子 8443。
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/ruoyi-gateway/tls/server.crt;
        ssl_certificate_key /etc/ruoyi-gateway/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ① 若依前端（生产构建，history 路由回退）
        root /var/www/ruoyi-ui;
        index index.html;

        location / {
            limit_req zone=gateway burst=60 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # ② 若依后端 API（前缀剥离转发到 8080）
        location /prod-api/ {
            limit_req zone=gateway burst=60 nodelay;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
            proxy_pass http://127.0.0.1:8080/;
        }

        # 登录端点单独限流（防爆破：每 IP 每分钟 10 次 + 突发 5 次）
        location = /prod-api/login {
            limit_req zone=login burst=5 nodelay;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8080/login;
        }

        # ③ agent_platform FastAPI（JWT 闸机；SSE 流式须关缓冲）
        location /agent-api/ {
            limit_req zone=gateway burst=60 nodelay;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_pass http://127.0.0.1:8000/;
        }
    }
}
