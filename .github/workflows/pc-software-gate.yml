name: PC software gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pc-software-gate:
    name: pc-software-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install PC test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tts,voice]"
      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Compile Python packages
        run: python -m compileall -q agent_platform evaluation deployment
      - name: Check browser JavaScript syntax
        run: node --check agent_platform/static/app.js
